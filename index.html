<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ff;--ink:#1a1638;--mut:#6a6590;--card:rgba(255,255,255,.7);--line:rgba(26,22,56,.12);--a:#5b5bff;--b:#ff5fa2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12102a;--ink:#edebff;--mut:#a09bd0;--card:rgba(36,32,76,.6);--line:rgba(237,235,255,.14)}}
:root[data-theme="dark"]{--bg:#12102a;--ink:#edebff;--mut:#a09bd0;--card:rgba(36,32,76,.6);--line:rgba(237,235,255,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;pointer-events:none;will-change:transform}
.b1{width:420px;height:420px;background:var(--a);top:-100px;left:-80px;animation:d1 22s ease-in-out infinite alternate}
.b2{width:380px;height:380px;background:var(--b);bottom:-120px;right:-60px;animation:d2 26s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(40vw,30vh) scale(1.2)}}
@keyframes d2{to{transform:translate(-35vw,-25vh) scale(.9)}}
#glow{position:fixed;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:radial-gradient(circle,rgba(255,95,162,.25),transparent 65%);pointer-events:none;z-index:1;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
main{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:76px 20px 80px}
h1{font:800 clamp(2.4rem,7vw,4.4rem)/1 Syne,sans-serif;margin:0 0 8px;letter-spacing:-.03em}
h1 span{display:inline-block;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
h1 span:nth-child(2){animation-delay:.12s;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotate(3deg)}}
.sub{color:var(--mut);margin:0 0 28px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;backdrop-filter:blur(12px);position:relative}
.tabs button{position:relative;z-index:1;border:0;background:none;color:var(--mut);font:500 14px 'DM Sans';padding:8px 16px;border-radius:99px;cursor:pointer;transition:color .3s}
.tabs button.on{color:#fff}
#pill{position:absolute;top:4px;bottom:4px;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));transition:left .45s cubic-bezier(.2,.9,.3,1.2),width .45s cubic-bezier(.2,.9,.3,1.2)}
.add{margin-left:auto;display:flex;gap:8px;flex:1 1 280px;max-width:420px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
input:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(91,91,255,.25)}
.btn{border:0;border-radius:12px;padding:10px 18px;font:600 14px 'DM Sans';color:#fff;background:linear-gradient(90deg,var(--a),var(--b));cursor:pointer;white-space:nowrap;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.btn:hover{transform:scale(1.06)}.btn:active{transform:scale(.95)}
.btn:focus-visible,.tabs button:focus-visible,.chip:focus-visible,.card:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#grid{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(14px);transform-style:preserve-3d;will-change:transform;transition:box-shadow .3s}
.card:hover{box-shadow:0 20px 50px -20px rgba(91,91,255,.5)}
.card h3{font:600 1.25rem/1.2 Syne,sans-serif;margin:0 0 6px}
.card p{margin:0;color:var(--mut);font-size:14px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.chip{border:0;border-radius:99px;padding:4px 12px;font:500 12px 'DM Sans';color:#fff;cursor:pointer;transition:background .4s,transform .2s}
.chip:active{transform:scale(.9)}
.s-Idea{background:#8a7dff}.s-Building{background:#e6409a}.s-Paused{background:#7a7596}.s-Shipped{background:#14a37f}
.prog{height:6px;border-radius:9px;background:var(--line);margin:16px 0 8px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .6s cubic-bezier(.2,.9,.3,1)}
input[type=range]{padding:0;border:0;background:none;box-shadow:none;accent-color:var(--a)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.card.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden}
.more textarea{margin-top:10px;min-height:90px;resize:vertical}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}
.del{border:0;background:none;color:var(--mut);cursor:pointer;font:inherit;font-size:13px;margin-top:8px;padding:0}
.del:hover{color:var(--b)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
#note{font-size:13px;color:var(--mut);margin-top:24px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gate{display:none;padding-top:12vh}body:not(.authed) .gate{display:block}body:not(.authed) .app{display:none}.topbar{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:18px;z-index:5}
.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font:700 18px Syne,sans-serif;display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:0;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.av:hover{transform:scale(1.1)}.av img{width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:0;top:54px;min-width:230px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 20px 40px -15px rgba(0,0,0,.5);opacity:0;transform:translateY(-8px) scale(.94);transform-origin:top right;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1.2)}
.topbar.open .menu{opacity:1;transform:none;pointer-events:auto}
.menu b{display:block}.menu small{display:block;color:var(--mut);margin-bottom:12px;word-break:break-all}.menu .btn{width:100%}
select{font:500 14px 'DM Sans';color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 14px;cursor:pointer;outline:none}
select:focus-visible{outline:2px solid var(--a)}option{background:var(--bg);color:var(--ink)}
.top h3{min-width:0;flex:1}
.acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
.pen{width:26px;height:26px;border:0;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s}
.pen:hover,.pen:focus-visible{transform:scale(1.15) rotate(-12deg);background:linear-gradient(135deg,var(--a),var(--b));color:#fff;outline:none}
.pen svg{width:13px;height:13px}
.ttl{font:600 1.25rem/1.2 Syne,sans-serif;padding:4px 8px;margin:-5px -9px;border-radius:10px}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div id="glow"></div>
<main>
<div class="gate"><h1><span>My</span> <span>projects</span></h1><p class="sub">Sign in to see your projects.</p><button class="btn" id="in">Sign in with Google</button><p id="err" class="sub"></p></div>
<div class="app">
<div class="topbar" id="tb"><button class="av" id="av" aria-label="Account menu"></button><div class="menu"><b id="who"></b><small id="em"></small><button class="btn" id="out">Sign out</button></div></div>
<h1><span>My</span> <span>projects</span></h1>
<div class="bar">
<div class="tabs" id="tabs"><span id="pill"></span></div>
<select id="sort" aria-label="Sort projects"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">Name A–Z</option><option value="prog">Most progress</option></select>
<form class="add" id="f" onsubmit="return false"><input id="t" placeholder="New project name" aria-label="New project name" maxlength="80"><button class="btn" id="addb" type="button">Add project</button></form>
</div>
<div id="grid"></div>
<p id="note" hidden>Something went wrong.</p>
</div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// ---- Your Firebase config: if sign-in fails, paste the block from Firebase Project settings over this ----
const firebaseConfig={
 apiKey:"AIzaSyBniBSZH00Q94dtzFff_72vDnH_HOAGfCI",
 authDomain:"my-project-tracker-42b5d.firebaseapp.com",
 projectId:"my-project-tracker-42b5d",
 storageBucket:"my-project-tracker-42b5d.firebasestorage.app",
 messagingSenderId:"372344472864",
 appId:"1:372344472864:web:09d3c17737f2cb17270345"
};
const STAT=['Idea','Building','Paused','Shipped'],TABS=['All',...STAT];
let items=[],filter='All',sortBy='new',col=null,mem=false;
const $=s=>document.querySelector(s),grid=$('#grid'),tabs=$('#tabs'),pill=$('#pill');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
TABS.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{filter=n;render(true)};tabs.appendChild(b)});
function movePill(){const b=[...tabs.querySelectorAll('button')];b.forEach(x=>x.classList.toggle('on',x.textContent===filter));const a=b.find(x=>x.classList.contains('on'));pill.style.left=a.offsetLeft+'px';pill.style.width=a.offsetWidth+'px'}
function save(p){if(col)setDoc(doc(col,p.id),{id:p.id,name:p.name,status:p.status,progress:p.progress,notes:p.notes||"",created:p.created}).catch(()=>{$("#note").hidden=false;$("#note").textContent="Could not save. Check your connection."})}
function render(animate){
 movePill();
 const first=new Map([...grid.children].map(c=>[c.dataset.id,c.getBoundingClientRect()]));
 const S={new:(a,b)=>b.created-a.created,old:(a,b)=>a.created-b.created,az:(a,b)=>a.name.localeCompare(b.name),prog:(a,b)=>b.progress-a.progress||b.created-a.created};
 const list=items.filter(p=>filter==='All'||p.status===filter).sort(S[sortBy]);
 const open=new Set([...grid.querySelectorAll('.open')].map(c=>c.dataset.id));
 grid.innerHTML=list.length?list.map(p=>`<article class="card ${open.has(p.id)?'open':''}" data-id="${p.id}" tabindex="0">
 <div class="top"><h3>${esc(p.name)}</h3><div class="acts"><button class="chip s-${p.status}" title="Change status">${p.status}</button><button class="pen" title="Rename" aria-label="Rename project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button></div></div>
 <p>${p.notes?esc(p.notes.slice(0,90)):'No notes yet'}</p>
 <div class="prog"><i style="width:${p.progress}%"></i></div>
 <div class="foot"><span>${p.progress}% done</span><span>${new Date(p.created).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span></div>
 <div class="more"><div>
 <input type="range" min="0" max="100" step="5" value="${p.progress}" aria-label="Progress">
 <textarea placeholder="Notes, links, next steps…" aria-label="Notes">${esc(p.notes||'')}</textarea>
 <button class="del">Delete project</button></div></div></article>`).join(''):`<div class="empty">${filter==='All'?'No projects yet. Add your first one above.':'Nothing marked '+filter+' yet.'}</div>`;
 [...grid.children].forEach(c=>{const o=first.get(c.dataset.id);if(!o||!c.dataset.id){if(animate!==false&&c.dataset.id)c.animate([{opacity:0,transform:'scale(.85) translateY(20px)'},{opacity:1,transform:'none'}],{duration:500,easing:'cubic-bezier(.2,.9,.3,1.2)'});return}
  const n=c.getBoundingClientRect(),dx=o.left-n.left,dy=o.top-n.top;
  if(dx||dy)c.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:550,easing:'cubic-bezier(.2,.9,.3,1.1)'})})
}
function editName(c,p){const h=c.querySelector('h3');if(h.querySelector('input'))return;
 const i=document.createElement('input');i.className='ttl';i.value=p.name;i.maxLength=80;i.setAttribute('aria-label','Project name');
 h.textContent='';h.appendChild(i);i.focus();i.select();
 let done=false;const fin=ok=>{if(done)return;done=true;const v=i.value.trim();if(ok&&v&&v!==p.name){p.name=v;save(p);render()}else h.textContent=p.name};
 i.onkeydown=e=>{if(e.key==='Enter')fin(true);if(e.key==='Escape')fin(false)};i.onblur=()=>fin(true)}
grid.addEventListener('click',e=>{
 const c=e.target.closest('.card');if(!c)return;const p=items.find(x=>x.id===c.dataset.id);
 if(e.target.closest('.pen')){editName(c,p);return}
 if(e.target.closest('.ttl'))return;
 if(e.target.closest('.chip')){p.status=STAT[(STAT.indexOf(p.status)+1)%4];if(p.status==='Shipped')p.progress=100;save(p);render();return}
 if(e.target.closest('.del')){c.animate([{opacity:1},{opacity:0,transform:'scale(.8)'}],{duration:250}).onfinish=()=>{items=items.filter(x=>x!==p);col&&deleteDoc(doc(col,p.id)).catch(()=>{});render()};return}
 if(e.target.closest('.more'))return;
 c.classList.toggle('open')});
grid.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();e.target.classList.toggle('open')}});
grid.addEventListener('input',e=>{const c=e.target.closest('.card'),p=items.find(x=>x.id===c.dataset.id);
 if(e.target.type==='range'){p.progress=+e.target.value;c.querySelector('.prog i').style.width=p.progress+'%';c.querySelector('.foot span').textContent=p.progress+'% done'}
 else{p.notes=e.target.value;c.querySelector('p').textContent=p.notes?p.notes.slice(0,90):'No notes yet'}
 clearTimeout(p._t);p._t=setTimeout(()=>save({id:p.id,name:p.name,status:p.status,progress:p.progress,notes:p.notes||'',created:p.created}),500)});
function add(){const v=$('#t').value.trim();if(!v)return;const p={id:'p'+Date.now().toString(36),name:v,status:'Idea',progress:0,notes:'',created:Date.now()};items.push(p);save(p);$('#t').value='';if(filter!=='All'&&filter!=='Idea')filter='All';render()}
$('#sort').onchange=e=>{sortBy=e.target.value;render()};
$('#av').onclick=e=>{e.stopPropagation();$('#tb').classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))$('#tb').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#tb').classList.remove('open')});
$('#addb').onclick=add;$('#t').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
// cursor glow + gentle card tilt
const glow=$('#glow');addEventListener('pointermove',e=>{glow.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;
 const c=e.target.closest&&e.target.closest('.card');grid.querySelectorAll('.card').forEach(k=>{if(k===c){const r=k.getBoundingClientRect();k.style.transform=`perspective(800px) rotateX(${-((e.clientY-r.top)/r.height-.5)*6}deg) rotateY(${((e.clientX-r.left)/r.width-.5)*6}deg)`}else k.style.transform=''})});
grid.addEventListener('pointerleave',()=>grid.querySelectorAll('.card').forEach(k=>k.style.transform=''));
addEventListener('resize',movePill);
render(false);
const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore();let unsub=null;
$('#in').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{$('#err').textContent='Sign-in failed: '+e.code});
$('#out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
 document.body.classList.toggle('authed',!!u);
 if(unsub){unsub();unsub=null}
 if(!u){items=[];col=null;render(false);return}
 const nm=u.displayName||u.email||'?';$('#who').textContent=nm;$('#em').textContent=u.email||'';
 const av=$('#av');av.textContent=nm[0].toUpperCase();
 if(u.photoURL){const im=new Image();im.referrerPolicy='no-referrer';im.alt='';im.onload=()=>{av.textContent='';av.appendChild(im)};im.src=u.photoURL}
 col=collection(db,'users',u.uid,'projects');
 unsub=onSnapshot(col,sn=>{if(document.activeElement&&document.activeElement.closest('.more,.ttl'))return;items=sn.docs.map(d=>d.data());render(false)},e=>{$('#note').hidden=false;$('#note').textContent='Could not load projects: '+e.code})
});
</script></body></html>
